name: build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Ballerina 2201.13.5 requires Java 21. Pinning it here rather than
      # relying on the runner's default JDK, which is how this build first
      # failed locally.
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Ballerina
        uses: ballerina-platform/setup-ballerina@v1.1.4
        with:
          version: 2201.13.5

      - name: Report the toolchain
        run: |
          bal version
          java -version

      - name: Test the library
        run: bal test --code-coverage

      # bal build, bal pack and bal doc all clear target/report, so the report
      # has to be copied aside before those steps run.
      - name: Stage the coverage report
        if: always()
        run: |
          mkdir -p ci-artifacts
          cp -r target/report ci-artifacts/library-coverage || true

      - name: Build the library
        run: bal build

      - name: Pack the library
        run: bal pack

      - name: Generate the API docs
        run: bal doc

      - name: Publish the library to the local repository
        run: bal push --repository=local

      # Each example resolves sanjulaonline/resilient_event_router from the local
      # repository, so this is what proves the packed artifact is usable from
      # outside the library's own module.
      - name: Test and build the examples
        run: |
          for example in examples/basic-webhook examples/generic-iot examples/sotercare; do
            echo "== $example =="
            (cd "$example" && bal test && bal build)
          done

      - name: Upload the coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: ci-artifacts/
          if-no-files-found: warn
